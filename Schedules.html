<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="AI-driven schedules and reminders">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Schedules</title>
  <link rel="stylesheet" href="Home.css">
  <style>
    /* Temporary CSS for layout and schedule display */
    .content-box {
      border: 1px solid #ccc;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }

    .schedule-form-box {
      background-color: #f9f9f9;
    }

    .weekly-schedule-box {
      background-color: #fff;
    }

    /* Styles for inline form */
    .schedule-form {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* New styles for displaying schedules inline */
    .days-schedule {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .day {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
    }

    .day button {
      padding: 8px 12px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
    }

    .day-schedules {
      font-size: 16px;
      color: #333;
      margin-left: 10px; /* Space between button and schedules */
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Weekly Schedules</h1>
    </header>
    <main>
      <aside class="sidebar">
        <ul>
          <li><a href="HomePage.html">AI</a></li>
          <li><a href="ToDo.html">To-Do</a></li>
          <li><a href="Reminders.html">Reminders</a></li>
          <li>
            <label>
              <input type="checkbox" id="adhan-reminder">
              Adhan Reminder
            </label>
            <div class="adhan-timings">
              <div class="adhan-timing">
                <label for="fajr-time">Fajr:</label>
                <input type="text" id="fajr-time" readonly>
              </div>
              <!-- Other adhan timings remain the same -->
            </div>
          </li>
        </ul>
        <div class="copyright">
          <p>&copy; Muhammad Ilyas | milyasstudent@gmail.com</p>
        </div>
      </aside>

      <section class="content">
        <!-- Schedules Form Box -->
        <div class="content-box schedule-form-box">
          <h2>Schedules Form</h2>
          <form id="scheduleForm" class="schedule-form">
            <div class="schedule-form-group">
              <label for="scheduleTitle">Name:</label>
              <input type="text" id="scheduleTitle" required>
            </div>
            <div class="schedule-form-group">
              <label for="scheduleDay">Day:</label>
              <select id="scheduleDay" required>
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
                <option value="Sunday">Sunday</option>
              </select>
            </div>
            <div class="schedule-form-group">
              <label for="scheduleTime">Time:</label>
              <input type="time" id="scheduleTime" required>
            </div>
            <div class="schedule-form-group">
              <label for="notify-me">Notify me:</label>
              <input type="checkbox" id="notify-me">
            </div>
            <button type="submit">Save</button>
          </form>
        </div>

        <!-- Weekly Schedules Box -->
        <div class="content-box weekly-schedule-box">
          <h2>Weekly Schedules</h2>
          <div class="days-schedule">
            <div class="day">
              <button onclick="showSchedules('Monday')">Monday</button>
              <span id="monday-schedules" class="day-schedules">No schedules yet.</span>
            </div>
            <div class="day">
              <button onclick="showSchedules('Tuesday')">Tuesday</button>
              <span id="tuesday-schedules" class="day-schedules">No schedules yet.</span>
            </div>
            <div class="day">
              <button onclick="showSchedules('Wednesday')">Wednesday</button>
              <span id="wednesday-schedules" class="day-schedules">No schedules yet.</span>
            </div>
            <div class="day">
              <button onclick="showSchedules('Thursday')">Thursday</button>
              <span id="thursday-schedules" class="day-schedules">No schedules yet.</span>
            </div>
            <div class="day">
              <button onclick="showSchedules('Friday')">Friday</button>
              <span id="friday-schedules" class="day-schedules">No schedules yet.</span>
            </div>
            <div class="day">
              <button onclick="showSchedules('Saturday')">Saturday</button>
              <span id="saturday-schedules" class="day-schedules">No schedules yet.</span>
            </div>
            <div class="day">
              <button onclick="showSchedules('Sunday')">Sunday</button>
              <span id="sunday-schedules" class="day-schedules">No schedules yet.</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="schedule.js"></script>
</body>
</html>
