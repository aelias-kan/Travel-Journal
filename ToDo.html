<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="AI-driven schedules and reminders">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do Page</title>
  <!-- <link rel="icon" href="favicon.ico"> -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>To-Do List</h1>
    </header>
    <main>
      <aside class="sidebar">
        <ul>
          <li><a href="HomePage.html">AI</a></li>
          <li><a style="background-color: #1BB295;" href="ToDo.html">To-Do</a></li>
          <li><a href="Schedules.html">Schedules</a></li>
          <li><a href="Reminders.html">Reminders</a></li>
          <li>
            <label>
              <input type="checkbox" id="adhan-reminder">
              Adhan Reminder
            </label>
            <div class="adhan-timings">
              <div class="adhan-timing">
                <label for="fajr-time">Fajr:</label>
                <input type="text" id="fajr-time" readonly>
              </div>
              <div class="adhan-timing">
                <label for="dhuhr-time">Dhuhr:</label>
                <input type="text" id="dhuhr-time" readonly>
              </div>
              <div class="adhan-timing">
                <label for="asr-time">Asr:</label>
                <input type="text" id="asr-time" readonly>
              </div>
              <div class="adhan-timing">
                <label for="maghrib-time">Maghrib:</label>
                <input type="text" id="maghrib-time" readonly>
              </div>
              <div class="adhan-timing">
                <label for="isha-time">Isha:</label>
                <input type="text" id="isha-time" readonly>
              </div>
            </div>
    
          </li>
        </ul>

        <!-- Adhan Timings Box -->

        <div class="copyright">
          <p>&copy; Muhammad Ilyas | milyasstudent@gmail.com</p>
        </div>
      </aside>

      <section class="content">
        <!-- Task Creation Section -->
        <div class="todo-task-creation">
          <h2>Create Task</h2>
          <form id="todo-taskForm" class="todo-form" style="display: flex; flex-wrap: wrap; gap: 10px;">
            <div class="todo-form-group" style="flex: 1;">
              <label for="todo-taskTitle" class="todo-label" style="margin-right: 10px;">Title:</label>
              <input type="text" id="todo-taskTitle" name="title" placeholder="Enter task title" required class="todo-input" style="flex: 1;">
            </div>
            <div class="todo-form-group" style="flex: 1;">
              <label for="todo-taskDate" class="todo-label" style="margin-right: 10px;">Date:</label>
              <input type="date" id="todo-taskDate" name="date" required class="todo-input" style="flex: 1;">
            </div>
            <div class="todo-form-group" style="flex: 1;">
              <label for="todo-taskTime" class="todo-label" style="margin-right: 10px;">Time:</label>
              <input type="time" id="todo-taskTime" name="time" required class="todo-input" style="flex: 1;">
            </div>
            <div class="todo-form-group" style="flex: 1;">
              <button type="submit" class="todo-submit-btn" style="padding: 8px 16px;">Create Task</button>
            </div>
          </form>
        </div>
        
        <!-- Task List Section -->
        <div class="task-list">
          <h2>Your Tasks</h2>
          <ul id="taskList"></ul>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
  <script src="location.js"></script> <!-- Closed tag fixed here -->
  <script src="reminder.js"></script>
  <script src="todo.js"></script>
  <script src="location.js"></script>
</body>
</html>
