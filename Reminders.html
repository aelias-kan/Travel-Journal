<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminders Page</title>
  <link rel="stylesheet" href="reminder.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Reminders</h1>
    </header>
    <main>
      <aside class="sidebar">
        <ul>
          <li><a href="HomePage.html">Home</a></li>
          <li><a href="#todo">To-Do List</a></li>
          <li><a href="#schedule">Schedule</a></li>
        </ul>
        <div class="copyright">
          <p>&copy; Muhammad Ilyas | <a href="mailto:milyasstudent@gmail.com">milyasstudent@gmail.com</a></p>
        </div>
      </aside>
      <section class="content">
        <div class="reminders-container">
          <h2>Manage Your Reminders</h2>
          <!-- Reminder management content goes here -->
          <div class="reminder-form">
            <h3>Create or Update Reminder</h3>
            <form id="reminderForm">
              <label for="reminderName">Name:</label>
              <input type="text" id="reminderName" name="name" required>

              <label for="reminderDate">Date:</label>
              <input type="date" id="reminderDate" name="date" required>

              <label for="reminderTime">Time:</label>
              <input type="time" id="reminderTime" name="time" required>

              <div class="reminder-alarm">
                <label for="reminderAlarm">
                  <input type="checkbox" id="reminderAlarm" name="alarm">
                  Alarm
                </label>
                <input type="file" id="alarmMusic" name="alarmMusic" accept="audio/*">
              </div>

              <div class="reminder-notification">
                <label for="reminderNotification">
                  <input type="checkbox" id="reminderNotification" name="notification">
                  Notification
                </label>
                <input type="file" id="notificationFile" name="notificationFile" accept="audio/*">
              </div>

              <button type="submit">Save Reminder</button>
            </form>
          </div>
          <div class="reminders-list">
            <h3>Your Reminders</h3>
            <!-- List of reminders goes here -->
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
